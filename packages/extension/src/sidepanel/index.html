<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      try {
        var pref = localStorage.getItem("opensider/theme");
        if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
        var resolved = pref === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
        document.documentElement.dataset.theme = resolved;
        var locale = localStorage.getItem("opensider/locale");
        if (locale !== "zh" && locale !== "en") locale = /^zh([-_]|$)/i.test(navigator.language || "") ? "zh" : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSider</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
